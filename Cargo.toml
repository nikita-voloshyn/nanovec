[package]
name = "nanovec"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency in-memory vector database as an MCP server"
license = "MIT"

[[bin]]
name = "nanovec"
path = "src/main.rs"

[lib]
name = "nanovec"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
rmcp = { version = "1.3", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Phase 2 — server-side embeddings (CPU-only, no cuda/metal/accelerate features).
candle-core = { version = "0.10", default-features = false }
candle-nn = { version = "0.10", default-features = false }
candle-transformers = { version = "0.10", default-features = false }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "default-tls"] }
once_cell = "1"

[dev-dependencies]
proptest = "1"
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
divan = "0.1"

[[bench]]
name = "distance"
harness = false

[[bench]]
name = "distance_divan"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "store"
harness = false

[[bench]]
name = "heap"
harness = false
